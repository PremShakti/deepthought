    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
    <script
      src="https://kit.fontawesome.com/24abdde451.js"
      crossorigin="anonymous"
    ></script>

    <script  type="module" src="script.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Initialize Quill editor
        var quill = new Quill("#editor-content", {
          modules: {
            toolbar: false, // We'll use our custom toolbar
          },
          placeholder: "Start typing...",
          theme: "snow",
        });

        // Set initial content
        quill.clipboard.dangerouslyPasteHTML(
          "can not find submission with the given pid, task_id and asset_id"
        );

        // Word count functionality
        const wordCountElement = document.getElementById("word-count");

        function updateWordCount() {
          const text = quill.getText();
          const words = text.trim() ? text.trim().split(/\s+/).length : 0;
          wordCountElement.textContent = words;
        }

        // Update word count on text change
        quill.on("text-change", updateWordCount);

        // Initial word count
        updateWordCount();

        // Toolbar functionality
        document.getElementById("bold").addEventListener("click", () => {
          const selection = quill.getSelection();
          if (selection) {
            const format = quill.getFormat(selection);
            quill.format("bold", !format.bold);
          }
        });

        document.getElementById("italic").addEventListener("click", () => {
          const selection = quill.getSelection();
          if (selection) {
            const format = quill.getFormat(selection);
            quill.format("italic", !format.italic);
          }
        });

        document.getElementById("undo").addEventListener("click", () => {
          quill.history.undo();
        });

        document.getElementById("redo").addEventListener("click", () => {
          quill.history.redo();
        });

        document
          .getElementById("format-block")
          .addEventListener("change", (e) => {
            const selection = quill.getSelection();
            if (selection) {
              quill.format(
                "header",
                e.target.value === "p"
                  ? false
                  : Number.parseInt(e.target.value.replace("h", ""))
              );
            }
          });

        document.getElementById("link").addEventListener("click", () => {
          const selection = quill.getSelection();
          if (selection) {
            const format = quill.getFormat(selection);
            if (format.link) {
              quill.format("link", false);
            } else {
              const url = prompt("Enter URL:");
              if (url) {
                quill.format("link", url);
              }
            }
          }
        });

        document.getElementById("image").addEventListener("click", () => {
          const url = prompt("Enter image URL:");
          if (url) {
            const range = quill.getSelection(true);
            quill.insertEmbed(range.index, "image", url);
          }
        });

        document.getElementById("fullscreen").addEventListener("click", () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            }
          }
        });
      });
    </script>
  </body>
</html>
