<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .Threadbuild-box-container {
        width: 450px;
        margin: auto;
        border: 1px solid red;
      }
      .collaps-bar {
        display: flex;
        align-items: center;
        gap: 40px;
        padding: 0px 10px;
        background-color: #feffc033;
      }
      .fa-angle-up {
        color: black;
        font-size: 20px;
      }
      .form-container {
      }
      .sub-thread-container {
        display: flex;
        gap: 20px;
        padding: 10px;
     
      }
      .subthread {
        width: 45%;
      }
      .innerinbox {
        position: relative;
        width: 100%;
        height: 105px;
        border-radius: 10px;
        background-color: #f6f6f6;
        overflow: hidden;
        box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px;
      }
      .textareainner {
        padding: 5px 10px;
        position: absolute;
        bottom: 0px;
        left: 0px;
        border-radius: 10px;
        background-color: white;
        outline: none;
        border: none;
        width: 100%;

        height: 60px;
      }
      .iner-subthread-heading {
        padding-left: 8px;
      }
      .iner-subthread-heading p {
        font-family: Open Sans;
        font-weight: 400;
        font-size: 12px;
        line-height: 16.34px;
        letter-spacing: 0%;
      }
      .iner-menue-items {
        display: flex;
        align-items: center;
        justify-content: end;
        gap: 10px;
        padding: 10px;
      }
      .iner-select-container {
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 10px 0px;
      }

      .iner-select {
        font-family: Poppins;
        font-weight: 600;
        font-size: 10px;
        line-height: 15px;
        letter-spacing: 0%;
        background-color: white;
        padding: 5px 1px;
        outline: none;
        border: none;
        box-shadow: rgba(0, 0, 0, 0.16) 0px 1px 4px;
        border-radius: 5px;
      }
      .sub-thread-button {
        padding: 1px 17px;
        border-radius: 10px;
        background-color: #0029ff;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border: none;
        outline: none;
        font-family: Roboto;
        font-weight: 500;
        font-size: 12px;
        line-height: 14.06px;
        letter-spacing: 0%;
      }
    </style>
  </head>
